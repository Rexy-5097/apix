# ─────────────────────────────────────────────────────────────────────────────
# REFERENCE SOURCES — not fare observations. These carry the weights and the
# expected-cell frame, and they are what AMB-8, AMB-9, OQ-4 and OQ-8 turn on.
# ─────────────────────────────────────────────────────────────────────────────

reference_sources:
  - reference_id: dgca_citypair_domestic_traffic
    purpose: "Route weights w[r] — spec G.2, OQ-4"
    publisher: "Directorate General of Civil Aviation (DGCA), Government of India"
    availability: PUBLISHED
    granularity: "city pair x month, passengers / freight / mail"
    carrier_dimension: ABSENT
    frequency: MONTHLY
    historical_depth: "mid-2015 onwards (per an independent mirror)"
    machine_readability: "XLSX at source; CSV via third-party mirrors"
    access_constraints: NOT_VERIFIED
    evidence: >-
      DGCA digigov portal, "city pair wise monthly domestic passenger traffic
      statistics". Structure corroborated by the independent mirror
      github.com/Vonter/india-aviation-traffic, whose README describes the
      domestic tables as "Monthly city-pair wise passenger, freight and mail
      traffic" and, separately, "Monthly carrier-pair wise ... traffic", and
      which states the source format is XLSX fetched from dgca.gov.in.
    evidence_date: "2026-09-10"
    resolves: "OQ-4 — appears SATISFIABLE for route weights"
    does_not_resolve: >-
      AMB-9. The city-pair table has NO carrier column. City-pair and carrier
      are published as two separate, uncrossed tables, so a carrier's share OF A
      GIVEN ROUTE cannot be read from them.
    verification_still_required: >-
      The DGCA page itself was reached but rendered a portal shell; the table
      structure above rests on the mirror's README and on search metadata, not
      on the primary file. DOWNLOAD THE PRIMARY XLSX AND CONFIRM THE COLUMNS
      before this is treated as settled.

  - reference_id: dgca_carrier_domestic_traffic
    purpose: "Context only — national carrier shares"
    publisher: DGCA
    availability: PUBLISHED
    granularity: "carrier x month, national totals"
    route_dimension: ABSENT
    frequency: MONTHLY
    historical_depth: "mid-2015 onwards"
    machine_readability: XLSX
    evidence_date: "2026-09-10"
    does_not_resolve: >-
      AMB-9. A national carrier share is not a within-route share, and applying
      one as the other would assume every carrier has identical route mix —
      false by inspection for a network carrier versus a regional operator.

  - reference_id: dgca_approved_flight_schedule
    purpose: "Expected cells (AMB-8); carrier capacity share (AMB-9 fallback)"
    publisher: "DGCA / Open Government Data (OGD) Platform India"
    availability: APPEARS_PUBLISHED
    claimed_granularity: >-
      flight number, airline operator, aircraft type, operating frequency
