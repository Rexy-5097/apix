# ─────────────────────────────────────────────────────────────────────────────
# CHANNEL B — DECLARED TARIFF SHEETS (reference envelope, not a transacted price)
# ─────────────────────────────────────────────────────────────────────────────
    # ── Checkpoint 2G automation gate ──
    automation_gate: AUTOMATION_ALLOWED
