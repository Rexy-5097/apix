  - source_id: data_gov_in
    display_name: data.gov.in — Open Government Data Platform India (OGD)
    channel: OFFICIAL_STATISTICS
    source_type: AUTHORIZED_FEED
    canonical_domain: api.data.gov.in
    collection_method: NOT_DESIGNED
    source_group: official_statistics
    robots_status: NOT_APPLICABLE
    tos_status: READ_VIA_PUBLIC_DOCUMENTATION
    tos_evidence: >-
      Government Open Data License - India read 2026-09-15 from an official
      NIC-hosted copy [TOOL]. The web portal returned HTTP 403 to the audit
      client while the API host itself answered; not retried with another
      client.
    automated_collection_status: NOT_VERIFIED
    captcha_or_interstitial_observed: NOT_APPLICABLE
    required_observation_fields: NONE_AVAILABLE
    known_field_gaps: >-
      ALL OF THEM. No flight number, departure time, travel date, advance-purchase
      window, fare family, baggage entitlement or fare in rupees exists anywhere
      on the platform.
    evidence_date: "2026-09-15"
    automation_gate: AUTOMATION_UNKNOWN
    manual_gate: NOT_APPLICABLE
    automation_gate_basis: >-
      A versioned REST API on a dedicated host (api.data.gov.in, v2.2.0) with a
      keyed resource endpoint, which is circumstantial but NOT a published
      permission [TOOL]. No reachable official page states that programmatic
      access is permitted, and GODL itself is silent on crawling -- it licenses
      what may be done with data already held, not the act of retrieval.
      Un-prohibited is not permitted.
    automation_gate_date: "2026-09-15"
    data_admissibility: INADMISSIBLE
    data_admissibility_basis: >-
      THE PLATFORM CARRIES NO AIRFARE DATA. Searched 2026-09-15 [TOOL]: of
      287,820 resources, zero carry "airfare" in title or description; the
      373-resource Aviation sector contains no fare-titled dataset; all 17
      "tariff" datasets are petroleum, electricity or telecom. The Ministry of
      Civil Aviation aviation series are departures, hours, kilometres,
      passengers, available seat kilometres, load factors and cargo -- capacity
      and traffic, not one rupee-denominated fare -- and most were last updated
      in 2018. The single airfare-titled resource is a 2022 Rajya Sabha answer
      annexure whose columns are airline against six evacuation cities, created
      and last updated the same day. Not a series, not per-flight.
    data_rights: RETENTION_PERMITTED
    data_rights_basis: >-
      THE ONLY SOURCE IN THIS REGISTER WHOSE LICENCE EXPLICITLY GRANTS WHAT APIx
      NEEDS, and it has no fares to grant it over. GODL section 3 [TOOL] gives
      "a worldwide, royalty-free, non-exclusive license to use, adapt, publish"
      data "(either in original, or in adapted and/or derivative forms)", to
      "create derivative works (including products and services)", "for all
      lawful commercial and non-commercial purposes". Section 2(g) includes
      "copying,distribution" and "publication of original and derived works"
      (punctuation as published). Conditions are attribution in the section 5
      format, including DOI or URL, and non-endorsement. A derived price index
      is squarely inside the grant. Licence is recorded PER DATASET in resource
      metadata, so read the licence element per resource rather than assuming
      GODL platform-wide.
    data_rights_date: "2026-09-15"
    permitted_use: >-
      Route weights and denominator context only -- spec G.2 and OQ-4. Never an
      observation source, because it contains no observations.

