# APIx source registry
#
# The artifact context/tech_stack.md names `registry.yaml` and
# src/apix/ingestion/README.md describes as "the source registry, recording what
# is committed for the prototype and what is DEFERRED RATHER THAN SILENTLY
# DROPPED". It lives at /source_registry/ because .github/CODEOWNERS reserves
# that path to @slazyverse, the ingestion, compliance and sources owner.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS FILE IS, AND WHAT IT IS NOT
# ─────────────────────────────────────────────────────────────────────────────
#
# It is a record of EVIDENCE, with the date the evidence was seen.
#
# It is NOT legal advice and NOT an authorisation to collect. No entry below
# authorises anything. `robots.txt` is a crawling directive, not a licence:
# a path that robots.txt does not disallow may still be governed by terms that
# prohibit automated collection. The converse also holds — a disallowed path is
# a stop signal under this project's own control contract regardless of what any
# terms say.
#
# STATUS VOCABULARY — used for `tos_status` and `automated_collection_status`.
# A value other than NOT_VERIFIED requires quoted text in `evidence`.
#
#   CLEARLY_PERMITTED        the source's own published text permits it
#   PERMITTED_WITH_CONDITIONS  permitted subject to stated conditions
#   UNCLEAR                  text retrieved, does not settle the question
#   NOT_PERMITTED            the source's own published text prohibits it
#   NOT_VERIFIED             not retrieved in this audit. THE DEFAULT.
#
# NOT_VERIFIED is not a soft yes. Nothing may be collected from a source whose
# terms have not been read.
#
# ─────────────────────────────────────────────────────────────────────────────
# AUTOMATION GATE — added at Checkpoint 2G
# ─────────────────────────────────────────────────────────────────────────────
#
# `automation_gate` is the first of TWO fields a collector must clear before
# making any request. It has four values and ONE of them permits automated
# collection:
#
#   AUTOMATION_ALLOWED     the source's own published terms permit automated
#                          collection. Requires POSITIVE evidence, quoted.
#   AUTOMATION_PROHIBITED  the source's terms prohibit it, OR its robots.txt
#                          disallows the path APIx needs. Either is decisive
#                          under compliance/collection-control-contract.md C-2.
#   AUTOMATION_UNKNOWN     no blocking evidence found, terms unread. BLOCKS
#                          collection. Absence of a prohibition is not a permission.
#   MANUAL_ONLY            automated collection is prohibited, but collection by
#                          a person in a browser is carved out or unaddressed.
#
# `manual_gate` is separate and deliberately so. A human reading a published
# price in a browser is a different activity from a scripted retrieval, and at
# least one source says so in its own terms. MoSPI's CPI collects airfare this
# way: Expert Group Report, "Airfare data are to be collected by State Regional
# Offices from the well-known websites."
#
# RULE OF CONSTRUCTION, applied throughout: robots.txt is a crawling directive,
# NOT a licence, and Terms of Use are NOT inferred from it. A robots Disallow
# sets automation_gate to PROHIBITED because THIS PROJECT honours robots.txt by
# its own contract — not because it establishes what the terms say. Conversely a
# permissive robots.txt yields UNKNOWN, never ALLOWED, because silence in
# robots.txt grants nothing.
#
# 2I CONFIRMED THIS THE HARD WAY. Akasa Air has the cleanest robots.txt of any
# source audited -- no Disallow at all -- and terms that prohibit copying any
# information from the site "in print, visual or electronic form, for any purpose
# whatsoever", with no browser carve-out. It is stricter than IndiGo, which
# robots.txt could never have told us. A source rated on robots.txt alone has had
# the wrong check done.
#
# `data_admissibility` is the SECOND gate, added at Checkpoint 2I, and it is
# orthogonal to the first. Permission and usefulness are independent properties:
# a source can be freely automatable and produce data the index must not touch.
#
#   ADMISSIBLE    the source yields a spec A.1 displayed, TRANSACTABLE offer.
#   INADMISSIBLE  it does not -- cached prices, stale prices, declared tariff
#                 categories, or a redistribution that breaks spec B.6 source
#                 independence. BLOCKS use as index input regardless of permission.
#   NOT_ASSESSED  not yet examined.
#
# BOTH gates must clear. Reading only the first is how a project ends up
# lawfully collecting numbers that are not prices.
#
# AS OF 2026-09-12 (Checkpoint 2I), after reading the licensed-feed documentation:
#
#   AUTOMATION_ALLOWED  : amadeus_self_service, travelpayouts -- BOTH INADMISSIBLE
#   data ADMISSIBLE     : indigo -- but AUTOMATION_PROHIBITED, MANUAL_PERMITTED
#
# The intersection of "may automate" and "data is usable" is EMPTY. That is why
# collection is manual: not because automation permission is missing everywhere,
# but because the two sources that grant it do not sell a transactable price.
#
# ─────────────────────────────────────────────────────────────────────────────
# AUDIT PROVENANCE
# ─────────────────────────────────────────────────────────────────────────────
#
# audit_date: 2026-09-10, Checkpoint 2F.
# Method: retrieval of published robots.txt only. No fare page was requested, no
# search was executed against any source, and no access control was tested.
#
# ENVIRONMENT CAVEAT, material to how these results should be read: the audit
# host sits behind a TLS-intercepting proxy (git push to github.com failed with
# SEC_E_UNTRUSTED_ROOT; goindigo.in returned "self signed certificate in
# certificate chain"). Retrieved content was therefore served through an
# intermediary. The robots.txt bodies recorded below are internally consistent
# and site-specific, but every one of them SHOULD BE RE-RETRIEVED from an
# un-intercepted network before it is relied on.
#
# Five sources could not be retrieved at all (timeout or TLS failure) and are
# recorded as NOT_VERIFIED with the reason. A timeout is an audit outcome. It
# was not retried with different transport, and no control was circumvented.

schema_version: "1.0.0"
audit_date: "2026-09-10"
checkpoint: "2F"
auditor: "@Rexy-5097"
domain_owner: "@slazyverse"
status: "PRE-ACQUISITION AUDIT — no source is cleared for collection"

# ─────────────────────────────────────────────────────────────────────────────
# INDEPENDENT SOURCE GROUPS — spec B.6
# ─────────────────────────────────────────────────────────────────────────────
#
# "Effective sample size is computed on independent source groups. Two
#  aggregators reselling one inventory feed are ONE observation, not two."
#
# Group membership is a fact about corporate ownership and inventory supply. It
# is NOT derivable from quotes, and two sites showing different prices in
# different interfaces is not evidence of independence. Every group below whose
# `independence` is UNKNOWN must be treated as potentially correlated until
# evidence exists, and must NOT be collapsed silently in either direction.
#
# This blocks OQ-A2 (cross-source spread "within and across independent source
# groups"): the spread cannot be interpreted without knowing the effective n.

source_groups:
  - group_id: carrier_direct_6e
    members: [indigo]
    independence: INHERENT
    rationale: >-
      A carrier's own portal is the origin of its own inventory. Independence
      from other carriers is structural, not an assumption.

  - group_id: carrier_direct_ai
    members: [air_india, air_india_express]
    independence: UNKNOWN
    rationale: >-
      Both are Air India group carriers and may share a distribution or
      reservation platform. Whether their portals constitute one inventory
      source or two is UNVERIFIED. Recorded as one provisional group because
      spec B.6 errs toward collapsing, and over-counting effective n is the
      error that rule exists to prevent.
    evidence: NOT_VERIFIED

  - group_id: carrier_direct_qp
    members: [akasa_air]
    independence: INHERENT

  - group_id: carrier_direct_sg
    members: [spicejet]
    independence: INHERENT

  - group_id: mmt_group
    members: [makemytrip, goibibo]
    independence: NOT_INDEPENDENT
    rationale: >-
      Treated as ONE source group. The dossier states it directly (p.12):
      "Same corporate group and shared inventory. Treating them as independent
      sources would understate correlation and inflate effective N."
    evidence: "docs/dossier/APIx_Engineering_Dossier_v2.1.pdf p.12"
    external_confirmation: PENDING
    notes: >-
      Assigned on the dossier's authority, which is the project's source of
      truth. Independent confirmation from published corporate filings has NOT
      been performed in this audit and should be, since the whole point of the
      rule is that group membership is external evidence.

  - group_id: yatra
    members: [yatra]
    independence: UNKNOWN
    evidence: NOT_VERIFIED
  - group_id: easemytrip
    members: [easemytrip]
    independence: UNKNOWN
    evidence: NOT_VERIFIED
  - group_id: cleartrip
    members: [cleartrip]
    independence: UNKNOWN
    evidence: NOT_VERIFIED
  - group_id: ixigo
    members: [ixigo]
    independence: UNKNOWN
    evidence: NOT_VERIFIED
    notes: >-
      Aggregators commonly resell a shared GDS or consolidator feed. Each is
      given its own provisional group ONLY because there is no evidence to
      merge them, not because independence has been established. Do not report
      an effective n over these until this is settled.

  - group_id: licensed_feed
    members: [amadeus_self_service, travelpayouts]
    independence: UNKNOWN
    evidence: NOT_VERIFIED
    notes: >-
      Both may ultimately surface GDS-sourced content that also reaches the
      aggregators. If so they are not independent OF THE AGGREGATORS either,
      which would collapse a large part of the frame into one group.

