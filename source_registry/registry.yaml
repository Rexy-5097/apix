      The dossier (p.11) describes Channel A as "Structured fares with base /
      tax / fee ALREADY DECOMPOSED". If that holds it is the only route to the
      spec A.4 decomposition, which no portal is known to render. It is a
      dossier claim and was NOT confirmed against current API documentation in
      this audit. This is exactly OQ-8: "Licensed-feed coverage of Indian
      domestic sectors and field availability."
      Spec H.3 constrains its use: AUTHORIZED_FEED is never silently
      substituted for a LIVE_SCRAPE observation being claimed.
    # ── Checkpoint 2G automation gate ──
    automation_gate: AUTOMATION_ALLOWED
    manual_gate: NOT_APPLICABLE
    automation_gate_basis: >-
      A published Self-Service API with public documentation and open developer
      registration. Programmatic access is the product; permission is positive and
      explicit. NOTE: automation permission is NOT sufficient -- see
      data_admissibility, which is what actually blocks this source.
    automation_gate_caveat: >-
      Production access additionally requires "a signed contract with an airline
      consolidator", which the project does not hold. That is a commercial gate with
      a lead time in weeks and is an OWNER decision, not an engineering one.
    automation_gate_date: "2026-09-12"
    data_admissibility: INADMISSIBLE
    data_admissibility_basis: >-
      Amadeus documentation retrieved 2026-09-12: the test environment uses "static
      cached data" and "prices aren't real". A cached, non-transactable price is not
      a spec A.1 displayed, transactable offer -- using it would be fabrication with
      an API key attached. Only the production tier carries real fares, and that is
      contract-gated.

