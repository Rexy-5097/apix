    evidence_date: "2026-09-10"
    notes: >-
      Per the dossier (p.5): under a DGCA direction of 13 May 2025 scheduled
      domestic airlines publish tariff sheets conspicuously and furnish
      route-wise tariff categories to the regulator monthly. The dossier is
      explicit about the limit: "a declared fare category is not a transacted
      consumer price". Useful as a reference ENVELOPE against which observed
      fares can be sanity-checked. Never as an index observation.

