    automation_gate_basis: >-
      A published affiliate data API with open registration. Programmatic access is
      the product. As with Amadeus, permission is not the blocker -- see
      data_admissibility.
    automation_gate_caveat: >-
      Whether its fare data is a redistribution of a feed also reaching the aggregators is unknown and bears on source-group independence.
    automation_gate_date: "2026-09-12"
    data_admissibility: INADMISSIBLE
    data_admissibility_basis: >-
      Two independent disqualifications, documentation retrieved 2026-09-12.
      (1) The Aviasales Data API "transfers data from the cache based on user search
      history", retained 2 to 7 days. A 2-to-7-day-old cache of what users happened
      to search is not a price at an instant; it is a biased sample of demand.
      Fails spec A.1.
      (2) Spec B.6: the cache IS Aviasales inventory, the same feed reaching the
      aggregator channel. Treating it as independent would inflate effective N in
      the direction that flatters the index. This RESOLVES the question left open at
      2F -- it is NOT independent of the aggregators.

