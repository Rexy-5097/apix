    robots_evidence: >-
      RE-AUDITED 2026-09-12, still NOT VERIFIED. https://www.goindigo.in/robots.txt
      and the Terms of Use path both timed out at 60s from the audit host,
      reproducing the 2F failure. A control fetch of akasaair.com/robots.txt
      succeeded in the same session, so this is specific to goindigo.in from this
      host and NOT a general network fault. Cause undetermined; recorded as an
      unresolved verification item, read as a finding in neither direction. It does
      mean the general Terms of Use -- the document that actually governs, per the
      scope caveat -- remain unread.
    tos_status: NOT_VERIFIED
    permitted_cadence_if_stated: NOT_VERIFIED
    rate_limit_if_stated: NOT_VERIFIED
    automated_collection_status: NOT_VERIFIED
    captcha_or_interstitial_observed: NOT_TESTED
    required_observation_fields: UNKNOWN
    known_field_gaps: UNKNOWN
    evidence_date: "2026-09-12"
    notes: >-
      Largest domestic carrier by fleet and frequency, so its absence would
      distort any exploratory frame more than any other single source. It is
      also the one this audit failed to reach. Re-audit first.
    # ── Checkpoint 2G automation gate ──
    automation_gate: AUTOMATION_PROHIBITED
    manual_gate: MANUAL_PERMITTED
    automation_gate_basis: >-
      IndiGo BluChip Programme Terms and Conditions, obtained 2026-09-11. Three explicit prohibitions: (a) "Committing unauthorized systematic retrieval of data or other content from the Platform to create or compile, directly or indirectly, a collection, compilation, database, or directory of information... without the written permission of IndiGo"; (b) "Engage in any automated use of the Program/Platform... or using any data mining tools, robots, or similar data gathering and extraction tools"; (c) "use, launch, development, or distribution of any automated system, including without limitation, any spider, robot, cheat utility, scraper, or offline reader that can access the Platform".
    manual_gate_basis: >-
      The SAME clause carves out manual use: "Except as may be the result of standard search engine or INTERNET BROWSER USAGE". A person reading a published price in a browser is expressly outside the prohibition.
    automation_gate_caveat: >-
      SCOPE CAVEAT, material: this is the LOYALTY PROGRAMME agreement, not the general website Terms of Use. "Platform" is defined by reference to the Program's hosting applications, which is arguably narrower than goindigo.in as a whole. The general Terms of Use and the Conditions of Carriage are separate documents, both referenced in the text obtained, BOTH STILL UNREAD. Re-classify when they are.
    automation_gate_date: "2026-09-11"
    data_admissibility: ADMISSIBLE
    data_admissibility_basis: >-
      Live fares displayed to a browsing consumer: a spec A.1 displayed, transactable
      offer by construction. This is the only reviewed source that is BOTH permitted
      for the collection mode used (manual) and admissible as index input.

