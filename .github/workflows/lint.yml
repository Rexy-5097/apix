name: APIx Lint

# Configuration and documentation linting.
#
# Python linting lives in ci.yml (ruff, mypy) so the two do not overlap. This
# workflow covers the YAML that configures AgentOS and the CI, plus internal
# documentation links.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: python -m pip install --upgrade pip yamllint

      - name: Lint configuration YAML
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            .agentos/ profiles/ runtime/policies/ validation/manifest.yaml \
            PROJECT_CONFIG.yaml apix_bootstrap.yaml

  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check internal markdown links
        run: python tools/ci/check_markdown_links.py
